name: macOS and Linux desktop builds

on:
  push:
    branches: [main, desktop-preview]
    paths: ['desktop/**', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libgif-dev libx11-dev xvfb xauth fonts-noto-cjk
      - name: Build and verify
        run: |
          cmake -S desktop -B build-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-desktop --parallel 2
          xvfb-run -a build-desktop/lightcapture --self-test
      - name: Package and verify installed app
        run: |
          bash desktop/package-linux.sh build-desktop artifacts
          sudo apt-get install -y --no-install-recommends ./artifacts/*.deb
          xvfb-run -a lightcapture --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-amd64
          path: artifacts/*.deb
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Qt and giflib
        run: |
          python -m pip install 'aqtinstall==3.3.0'
          aqt install-qt mac desktop 6.8.3 clang_64 --outputdir "$RUNNER_TEMP/qt" --archives qtbase
          brew install giflib
      - name: Build and verify
        run: |
          qt="$RUNNER_TEMP/qt/6.8.3/macos"
          giflib="$(brew --prefix giflib)"
          cmake -S desktop -B build-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$qt" -DGIF_INCLUDE_DIR="$giflib/include" -DGIF_LIBRARY="$giflib/lib/libgif.a"
          cmake --build build-desktop --parallel 2
          QT_QPA_PLATFORM=offscreen build-desktop/LightCapture.app/Contents/MacOS/LightCapture --self-test
      - name: Bundle and verify
        run: |
          set -euo pipefail
          qt="$RUNNER_TEMP/qt/6.8.3/macos"
          app=build-desktop/LightCapture.app
          "$qt/bin/macdeployqt" "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p artifacts LightCapture-macOS/Licenses
          mv "$app" LightCapture-macOS/
          cp desktop/README.md LightCapture-macOS/README.md
          for license in LGPL-3.0-only GPL-3.0-only; do
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES/$license.txt" -o "LightCapture-macOS/Licenses/$license.txt"
          done
          giflib="$(brew --prefix giflib)"
          cp "$giflib/COPYING" LightCapture-macOS/Licenses/GIFLIB.txt
          ditto -c -k --sequesterRsrc --keepParent LightCapture-macOS "artifacts/LightCapture-1.2.0-preview.1-macos-${{ matrix.arch }}.zip"
          mkdir extracted
          ditto -x -k artifacts/*.zip extracted
          codesign --verify --deep --strict extracted/LightCapture-macOS/LightCapture.app
          binary=extracted/LightCapture-macOS/LightCapture.app/Contents/MacOS/LightCapture
          test "$(lipo -archs "$binary")" = "${{ matrix.arch }}"
          QT_QPA_PLATFORM=cocoa "$binary" --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error
